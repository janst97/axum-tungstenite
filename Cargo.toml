[package]
name = "axum-tungstenite"
version = "0.3.0"
categories = ["asynchronous", "network-programming", "web-programming"]
description = "WebSocket connections for axum directly using tungstenite"
edition = "2021"
homepage = "https://github.com/davidpdrsn/axum-tungstenite"
keywords = ["http", "web", "framework"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/davidpdrsn/axum-tungstenite"

[dependencies]
async-trait = "0.1.92"
axum-core = "0.5.6"
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
http = "1.5.0"
http-body = "1.1.0"
hyper = "1.12.0"
hyper-util = { version = "0.1.21", features = ["tokio"] }
sha-1 = "0.10.1"
tokio = { version = "1.53.2", features = ["rt"] }
tokio-tungstenite = "0.30.0"

[dev-dependencies]
axum = "0.8.9"
